name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/husam/medicine
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MedicineReminder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.husam.medicine'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.husam.medicine'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">منبه الأدوية</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#111111</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false"/>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/husam/medicine/MainActivity.java <<'EOF'
          package com.husam.medicine;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {

              LinearLayout root;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{"android.permission.POST_NOTIFICATIONS"},
                          100
                      );
                  }

                  ReminderReceiver.createChannel(this);
                  buildScreen();

                  schedule("لانسوبرازول", "11:00", 1100);
                  schedule("لانسوبرازول", "18:00", 1800);
                  schedule("يونيبيليت", "18:00", 1801);
              }

              void buildScreen() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(35,35,35,35);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView title = new TextView(this);
                  title.setText("💊 منبه الأدوية");
                  title.setTextSize(30);
                  title.setTextColor(Color.BLACK);
                  title.setGravity(Gravity.CENTER);

                                    root.addView(
                      title,
                      new LinearLayout.LayoutParams(-1,100)
                  );

                  addMedicine(
                      "لانسوبرازول",
                      "حبة صباحًا قبل الفطور — 11:00"
                  );

                  addMedicine(
                      "لانسوبرازول",
                      "حبة مساءً قبل الغداء — 18:00"
                  );

                  addMedicine(
                      "يونيبيليت",
                      "حبة واحدة بعد الغداء — 18:00"
                  );

                  TextView note = new TextView(this);

                  note.setText(
                      "اضغط «تم أخذ الدواء» بعد تناول الجرعة."
                  );

                  note.setTextSize(18);
                  note.setGravity(Gravity.CENTER);

                  root.addView(note);

                  setContentView(root);
              }

              void addMedicine(String name, String details) {

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(25,20,25,20);

                  TextView n = new TextView(this);
                  n.setText(name);
                  n.setTextSize(23);

                  TextView d = new TextView(this);
                  d.setText(details);
                  d.setTextSize(17);

                  Button done = new Button(this);
                  done.setText("✓ تم أخذ الدواء");

                  done.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "تم تسجيل أخذ الدواء ✓",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  card.addView(n);
                  card.addView(d);
                  card.addView(done);

                  root.addView(
                      card,
                      new LinearLayout.LayoutParams(-1,-2)
                  );
              }

              void schedule(String medicine, String time, int id) {

                  try {

                      String[] p = time.split(":");
                      Calendar c = Calendar.getInstance();

                      c.set(Calendar.HOUR_OF_DAY,
                          Integer.parseInt(p[0]));
                      c.set(Calendar.MINUTE,
                          Integer.parseInt(p[1]));
                      c.set(Calendar.SECOND,0);
                      c.set(Calendar.MILLISECOND,0);

                      if (c.getTimeInMillis() <=
                          System.currentTimeMillis()) {
                          c.add(Calendar.DAY_OF_YEAR,1);
                      }

                      Intent i = new Intent(
                          this,
                          ReminderReceiver.class
                      );

                      i.putExtra("medicine",medicine);
                      i.putExtra("time",time);

                      PendingIntent pi =
                          PendingIntent.getBroadcast(
                              this,
                              id,
                              i,
                              PendingIntent.FLAG_UPDATE_CURRENT |
                              PendingIntent.FLAG_IMMUTABLE
                          );

                      AlarmManager am =
                          (AlarmManager)getSystemService(
                              ALARM_SERVICE
                          );

                      am.setRepeating(
                          AlarmManager.RTC_WAKEUP,
                          c.getTimeInMillis(),
                          AlarmManager.INTERVAL_DAY,
                          pi
                      );

                  } catch(Exception ignored) {}
              }
          }
          EOF

          cat > app/src/main/java/com/husam/medicine/ReminderReceiver.java <<'EOF'
          package com.husam.medicine;

          import android.app.*;
          import android.content.*;
          import android.os.*;

          public class ReminderReceiver extends BroadcastReceiver {

              static final String CHANNEL = "medicine_reminders";

              static void createChannel(Context c) {

                  if (Build.VERSION.SDK_INT >= 26) {

                      NotificationChannel ch =
                          new NotificationChannel(
                              CHANNEL,
                              "تذكير الأدوية",
                              NotificationManager.IMPORTANCE_HIGH
                          );

                      NotificationManager nm =
                          c.getSystemService(
                              NotificationManager.class
                          );

                      nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public void onReceive(Context c, Intent i) {

                  createChannel(c);

                  String medicine =
                      i.getStringExtra("medicine");

                  String time =
                      i.getStringExtra("time");

                  Notification.Builder n =
                      Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(c, CHANNEL)
                      : new Notification.Builder(c);

                  n.setSmallIcon(
                      android.R.drawable.ic_dialog_info
                  );

                  n.setContentTitle(
                      "💊 حان وقت الدواء"
                  );

                  n.setContentText(
                      medicine + " — الساعة " + time
                  );

                  n.setPriority(
                      Notification.PRIORITY_HIGH
                  );

                  n.setAutoCancel(true);

                  NotificationManager nm =
                      (NotificationManager)
                      c.getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );

                  nm.notify(
                      (int)(System.currentTimeMillis() & 0x7fffffff),
                      n.build()
                  );
              }
          }
          EOF

          gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicineReminder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

